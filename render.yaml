# Render Blueprint for filiphagen.com.
#
# This mirrors the TWO SERVICES THAT ALREADY EXIST in the Render workspace —
# it is a written record of their configuration, not a proposal:
#
#   MERN-frontend  static site  srv-cio45al9aq06u3mh5al0  https://mern-0tft.onrender.com
#   MERN-backend   web service  srv-cio6mst9aq06u3n16lp0  https://mern-backend-sjet.onrender.com
#
# www.filiphagen.com already CNAMEs to the static site (via Cloudflare), so the
# static-first split described in ADR 0001 was already the deployed reality.
#
# Names must match the existing services exactly. Adopting this Blueprint with
# different names would create duplicates rather than adopt what is there.

services:
  # The SPA as static files on Render's CDN. No process, so no cold start:
  # the portfolio never waits on the API (ADR 0001).
  - type: web
    runtime: static
    name: MERN-frontend
    repo: https://github.com/Darti12/MERN
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    buildFilter:
      paths:
        - frontend/**
      ignoredPaths:
        - backend/**
    # SPA fallback. Client-side routing means /cv and /projects/mern are not
    # files on disk; without this they 404 on refresh or a direct link.
    # NOTE: Render does NOT read Netlify-style _redirects files. This is the
    # only mechanism that works here (or the Dashboard's Redirects/Rewrites).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Node 22 LTS. Vite 8 and @vitejs/plugin-react 6 require
      # ^20.19 || >=22.12, and Node 18 went end-of-life in April 2025.
      - key: NODE_VERSION
        value: "22"
      # Absolute origin of the API. Renamed from REACT_APP_API_URL by the
      # Vite migration (ADR 0003). Baked into the bundle at build time, so
      # changing it needs a rebuild, not a restart.
      - key: VITE_API_URL
        value: https://mern-backend-sjet.onrender.com

  # The Express API, scale-to-zero on the free plan. Only /chat needs it.
  - type: web
    runtime: node
    name: MERN-backend
    repo: https://github.com/Darti12/MERN
    branch: main
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: node server.js
    # Real route since the health task; the old Dockerfile healthcheck polled
    # a /health that did not exist. server.js now opens the port before Mongo
    # connects, so this answers during a database outage instead of failing
    # the deploy.
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - frontend/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Origin of the static site, so CORS admits it
      # (backend/config/allowedOrigins.js). The apex and www domains are
      # already hardcoded there.
      - key: STATIC_SITE_URL
        value: https://mern-0tft.onrender.com
      - key: MONGO_URI
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Abuse guard (ADR 0002). Code defaults match these; set here so the
      # number that bounds the bill is visible in version control.
      - key: CHAT_DAILY_TOKEN_CEILING
        value: "300000"
      - key: CHAT_RATE_LIMIT_MAX
        value: "20"
      - key: CHAT_BODY_LIMIT
        value: 16kb
